name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure Git Safe Directory
      run: |
        git config --global --add safe.directory "*"

    - name: Setup recipe folder
      run: |
        mkdir -p p4a-recipes/pygame-ce
        cp p4a-recipes/pygame-ce/__init__.py /tmp/recipe_check.py 2>/dev/null || true
        ls -la p4a-recipes/pygame-ce/

    - name: Create buildozer.spec
      run: |
        printf '[app]\n' > buildozer.spec
        printf 'title = Ludo Realms\n' >> buildozer.spec
        printf 'package.name = ludorealms\n' >> buildozer.spec
        printf 'package.domain = com.atharv.ludorealms\n' >> buildozer.spec
        printf 'source.dir = .\n' >> buildozer.spec
        printf 'source.include_exts = py,png,jpg,jpeg,ogg,wav,mp3,ttf,otf,json,atlas\n' >> buildozer.spec
        printf 'version = 1.0\n' >> buildozer.spec
        printf 'requirements = python3==3.10.12,hostpython3==3.10.12,pygame\n' >> buildozer.spec
        printf 'orientation = portrait\n' >> buildozer.spec
        printf 'fullscreen = 1\n' >> buildozer.spec
        printf 'android.api = 34\n' >> buildozer.spec
        printf 'android.minapi = 21\n' >> buildozer.spec
        printf 'android.ndk_api = 21\n' >> buildozer.spec
        printf 'android.archs = arm64-v8a\n' >> buildozer.spec
        printf 'android.accept_sdk_license = True\n' >> buildozer.spec
        printf 'android.permissions = INTERNET,VIBRATE\n' >> buildozer.spec

    - name: Build with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LudoRealms-APK
        path: bin/*.apk
